<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found — Project Index</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08090a;
        --panel: #0d0f11;
        --line: #20252a;
        --ink: #e8e6e3;
        --muted: #8b949e;
        --amber: #ffb000;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 24px;
      }
      main {
        width: min(100%, 560px);
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 32px;
      }
      p, a { font-size: 12px; line-height: 1.7; color: var(--muted); }
      h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -0.04em; }
      span { color: var(--amber); }
      a { color: var(--amber); text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>404<span>.</span></h1>
      <p>This path is not part of the index.</p>
      <p><a href="/">Return to the project index</a></p>
    </main>
  </body>
</html>
